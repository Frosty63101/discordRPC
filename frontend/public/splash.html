<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Starting Reading Presence</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body { background: #152238; color: #f1f6ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; align-items: center; justify-content: center; }
        .content { text-align: center; padding: 30px 25px; }
        .icon { width: 94px; height: 94px; display: block; margin: 0 auto 20px; }
        h1 { font-size: 22px; letter-spacing: -.4px; margin: 0 0 8px; font-weight: 750; }
        p { font-size: 13px; color: #b8c8df; margin: 0 0 20px; }
        .progress { height: 4px; width: 175px; border-radius: 9px; background: #3b506d; margin: auto; overflow: hidden; }
        .bar { height: 100%; width: 60px; border-radius: 9px; background: #55c5b9; animation: sweep 1.35s ease-in-out infinite alternate; }
        @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(115px); } }
        @media (prefers-reduced-motion: reduce) { .bar { animation: none; width: 100%; } }
    </style>
</head>
<body>
    <main class="content">
        <img class="icon" alt="" src="./book-icon.svg"/>
        <h1>Reading Presence</h1>
        <p>Connecting your reading activity to Discord…</p>
        <div class="progress" role="progressbar" aria-label="Starting"><div class="bar"></div></div>
    </main>
</body>
</html>
